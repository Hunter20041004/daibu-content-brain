<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 118" role="img" aria-label="呆一布吉祥物">
  <!--
    呆一布吉祥物 — 依 DIVE web 設計稿外觀重繪的近似版本。
    正式圖檔若日後從 Figma 匯出，直接replace 本檔即可。

    顏色以 CSS 變數提供，因此這個 SVG 必須「內嵌」進 HTML（st.markdown 的
    unsafe_allow_html）才會跟著淺色／深色模式換色；用 <img> 載入時變數不會生效，
    會退回括號內的預設值（淺色模式的品牌色）。
  -->
  <g fill="none">
    <!-- 天線 -->
    <path d="M64 20V10" stroke="var(--mascot-shell, #6FC1CC)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="64" cy="8" r="8" fill="var(--mascot-accent, #F8C0A0)"/>

    <!-- 兩側耳朵 -->
    <rect x="0" y="52" width="14" height="30" rx="7" fill="var(--mascot-shell, #6FC1CC)"/>
    <rect x="114" y="52" width="14" height="30" rx="7" fill="var(--mascot-shell, #6FC1CC)"/>

    <!-- 頭殼 -->
    <rect x="10" y="20" width="108" height="90" rx="30" fill="var(--mascot-shell, #6FC1CC)"/>
    <!-- 臉板 -->
    <rect x="24" y="34" width="80" height="62" rx="22" fill="var(--mascot-face, #FAFCFE)"/>

    <!-- 眼睛 -->
    <ellipse cx="48" cy="58" rx="6" ry="6.5" fill="var(--mascot-ink, #0E0E2C)"/>
    <ellipse cx="80" cy="58" rx="6" ry="6.5" fill="var(--mascot-ink, #0E0E2C)"/>

    <!-- 腮紅 -->
    <ellipse cx="37" cy="74" rx="8" ry="6" fill="var(--mascot-accent, #F8C0A0)"/>
    <ellipse cx="91" cy="74" rx="8" ry="6" fill="var(--mascot-accent, #F8C0A0)"/>

    <!-- 笑嘴 -->
    <path d="M55 72q9 13 18 0" stroke="var(--mascot-ink, #0E0E2C)" stroke-width="4.5" stroke-linecap="round"/>
  </g>
</svg>
